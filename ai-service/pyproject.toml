[project]
name = "calendar-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "scalar-fastapi",
    "redis>=5",
    "SQLAlchemy[asyncio]>=2",
    "aiomysql>=0.2",
    "jieba>=0.42.1",
    "minio>=7.2",
    "python-multipart>=0.0.9",
    "pypdf>=5",
    "python-docx>=1.1",
    "langgraph>=1.0,<2",
    "tzdata>=2025.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
