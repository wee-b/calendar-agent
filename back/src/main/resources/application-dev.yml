app:
  datasource:
    host: localhost
    port: 3306
    database: yl_database
    username: root
    password: 123
  redis:
    host: localhost
    port: 6379
    database: 15
  sa-token:
    token-name: yvli-token
    timeout: 604800
  ai:
    api-key: ${unknown.deepseek.api-key}
    base-url: https://api.deepseek.com
    model: deepseek-v4-flash
  rag:
    ollama-url: http://localhost:11434
    embedding-model: bge-m3
    milvus-host: localhost
    milvus-port: 19530
    milvus-collection: rag_corpus
    top-k: 3
    bm25-top-k: 10     # 原 20 → 10，BM25 候选数
    dense-top-k: 10
    recall-threshold: 0.1 # 新增，RRF 融合后低于此分数的直接丢弃
    embedding-cache-ttl: 360  # 新增，embedding 缓存秒数
    lucene-index-dir: ./data/lucene-rag-index
