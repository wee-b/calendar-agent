app:
  datasource:
    host: localhost
    port: 3306
    database: yl_database
    username: root
    password: 123
  redis:
    host: localhost
    port: 6379
    database: 15
  sa-token:
    token-name: yvli-token
    timeout: 604800
  ai:
    api-key: ${unknown.aliyun.api-key}
    base-url: ${ALIYUN_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${ALIYUN_QWEN_MODEL:qwen3.7-plus}
    planner-model: ${ALIYUN_PLANNER_MODEL:deepseek-v4-flash}
  qdrant:
    host: localhost
    port: 6334
    collection: rag_corpus

  rag:
    # 本地默认使用 ollama；部署时设置 RAG_EMBEDDING_PROVIDER=aliyun 切到阿里云百炼
#    embedding-provider: ${RAG_EMBEDDING_PROVIDER:ollama}
    embedding-provider: aliyun

    ollama:
      url: ${RAG_OLLAMA_URL:http://localhost:11434}
      model: ${RAG_OLLAMA_MODEL:bge-m3}

    aliyun:
      base-url: ${RAG_ALIYUN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${unknown.aliyun.api-key}
      model: ${RAG_ALIYUN_MODEL:text-embedding-v4}



