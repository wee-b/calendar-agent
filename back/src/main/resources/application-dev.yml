app:
  datasource:
    host: localhost
    port: 3306
    database: yl_database
    username: root
    password: 123
  redis:
    host: localhost
    port: 6379
    database: 15
    password: 123
  sa-token:
    token-name: yvli-token
    timeout: 604800
  ai:
    default-provider: aliyun
    providers:
      aliyun:
        type: openai-compatible
        api-key: ${unknown.aliyun.api-key}
        base-url: ${unknown.aliyun.base-url:https://dashscope.aliyuncs.com/compatible-mode/v1}
      deepseek:
        type: openai-compatible
        api-key: ${unknown.deepseek.api-key}
        base-url: ${unknown.deepseek.base-url:https://api.deepseek.com}
      ark:
        type: image-generation
        api-key: ${unknown.huosan.api-key}
        base-url: ${unknown.huosan.base-url:https://ark.cn-beijing.volces.com/api/v3}
    agents:
      route:
        provider: aliyun
        model: ${ALIYUN_QWEN_MODEL:qwen3.7-plus}
        temperature: 0.1
      chat:
        provider: deepseek
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
        temperature: 0.3
      executor:
        provider: aliyun
        model: ${ALIYUN_QWEN_MODEL:qwen3.7-plus}
        temperature: 0.3
      planner:
        provider: deepseek
        # 默认使用快速模型；需要更高质量时可通过环境变量切回 deepseek-v4-pro。
        model: ${DEEPSEEK_PLANNER_MODEL:deepseek-flash}
        temperature: 0.1
      summary:
        provider: aliyun
        model: ${ALIYUN_QWEN_MODEL:qwen3.7-plus}
        temperature: 0.1
      rag:
        provider: aliyun
        model: ${ALIYUN_QWEN_MODEL:qwen3.7-plus}
        temperature: 0.1
      image:
        provider: ark
        model: ${ARK_IMAGE_MODEL:doubao-seedream-5-0-flash-260915}
        size: ${ARK_IMAGE_SIZE:2K}
        watermark: ${ARK_IMAGE_WATERMARK:true}
  qdrant:
    host: localhost
    port: 6334
    collection: rag_corpus

  rag:
    # 本地默认使用 ollama；部署时设置 RAG_EMBEDDING_PROVIDER=aliyun 切到阿里云百炼
#    embedding-provider: ${RAG_EMBEDDING_PROVIDER:ollama}
    embedding-provider: aliyun

    ollama:
      url: ${RAG_OLLAMA_URL:http://localhost:11434}
      model: ${RAG_OLLAMA_MODEL:bge-m3}

    aliyun:
      base-url: ${RAG_ALIYUN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${unknown.aliyun.api-key}
      model: ${RAG_ALIYUN_MODEL:text-embedding-v4}
