spring:
  profiles:
    active: dev,unknown

  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://${app.datasource.host}:${app.datasource.port}/${app.datasource.database}?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${app.datasource.username}
    password: ${app.datasource.password}

  # Redis 配置
  data:
    redis:
      host: ${app.redis.host}
      port: ${app.redis.port}
      database: ${app.redis.database}
      password: ${app.redis.password:}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# Sa-Token 配置
sa-token:
  token-name: ${app.sa-token.token-name}
  timeout: ${app.sa-token.timeout}
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false


rag:

  top-k: 3
  bm25-top-k: 10
  dense-top-k: 10
  # 小规模规划语料直接使用 RRF 排序；关闭远程 LLM 重排可减少十几秒延迟。
  rerank-enabled: false
  # RRF 单路首位约 0.0164、双路重合首位约 0.0328；0.015 可保留单路前几名和双路重合结果。
  recall-threshold: 0.015
  # Embedding 由 provider+model+原文隔离，结果稳定，缓存一天以减少远程调用。
  embedding-cache-ttl: 86400
  lucene-index-dir: ./data/lucene-rag-index
  # 最终检索结果缓存 30 分钟，兼顾响应速度和语料更新后的生效时间。
  result-cache-ttl: 1800

app:
  # 设为 true 时打印 SQL 及执行耗时；修改后需要重启应用。
  sql-log:
    enabled: ${SQL_LOG_ENABLED:false}
  chat:
    sse-executor:
      core-size: 4
      max-size: 12
      queue-capacity: 50
