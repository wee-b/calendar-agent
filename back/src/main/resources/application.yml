spring:
  profiles:
    active: dev,unknown

  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://${app.datasource.host}:${app.datasource.port}/${app.datasource.database}?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${app.datasource.username}
    password: ${app.datasource.password}

  # Redis 配置
  data:
    redis:
      host: ${app.redis.host}
      port: ${app.redis.port}
      database: ${app.redis.database}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# Sa-Token 配置
sa-token:
  token-name: ${app.sa-token.token-name}
  timeout: ${app.sa-token.timeout}
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false


rag:

  top-k: 3
  bm25-top-k: 10     # 原 20 → 10，BM25 候选数
  dense-top-k: 10
  recall-threshold: 0.1 # 新增，RRF 融合后低于此分数的直接丢弃
  embedding-cache-ttl: 360  # 新增，embedding 缓存秒数
  lucene-index-dir: ./data/lucene-rag-index

  result-cache-ttl: 180